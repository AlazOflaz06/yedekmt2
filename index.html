<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not hidden{display:none!important}</style></head><body>
<title>Metin2 3D - Official Remastered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0908;
  --panel:#171310;
  --panel2:#221b16;
  --line:#3a2e25;
  --gold:#d9a441;
  --blood:#c0392f;
  --jade:#3f9a82;
  --mana:#4a78c9;
  --text:#eadfce;
  --mute:#a09280;
  --font-display:'Philosopher',Georgia,serif;
  --font-body:'Rubik',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;left:0;top:0;font-weight:600;font-size:15px;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;will-change:transform,opacity}
.dmg.big{font-size:22px;font-weight:700}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:disabled{opacity:.45;cursor:not-allowed}

.mobLabel{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  font-size:11px;
  color:#fff;
  text-shadow:0 1px 3px #000, 0 0 5px #000;
  pointer-events:none;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  z-index:4;
  background:rgba(13,11,10,0.75);
  padding:1px 6px;
  border-radius:3px;
  border:1px solid rgba(217,164,65,0.4);
  display:none;
}
.mobLabel b{color:var(--gold)}
.mobLabel.metin{border-color:#b88cf5;color:#e8d8ff}
.mobLabel.boss{border-color:#c0392f;color:#ff9a8a;font-size:12px}
.mobLabel.npc{border-color:#3f9a82;color:#8ff3ff}

#playerLabel{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  font-size:13px;
  color:#fff;
  text-shadow:0 1px 3px #000, 0 0 6px #000;
  pointer-events:none;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  z-index:5;
  background:rgba(13,11,10,0.85);
  padding:2px 8px;
  border-radius:4px;
  border:1px solid rgba(217,164,65,0.7);
}
#playerLabel b{color:var(--gold)}

#loginScreen{position:absolute;inset:0;background:rgba(13,11,10,0.96);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(8px)}
.login-box{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:24px;width:min(540px,94vw);box-shadow:0 10px 35px rgba(0,0,0,0.9);text-align:center}
.login-box h2{font-family:var(--font-display);color:var(--gold);font-size:28px;margin:0 0 14px;letter-spacing:1px}
.login-box input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--gold);font-family:var(--font-display);font-size:15px;text-align:center;box-sizing:border-box;margin-bottom:10px;outline:none}

.char-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 20px;max-height:280px;overflow-y:auto;padding-right:4px}
.char-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:12px}
.char-card:hover,.char-card.on{border-color:var(--gold);background:#2c221b;box-shadow:0 0 12px rgba(217,164,65,0.35)}
.char-avatar{width:48px;height:48px;border-radius:50%;background:#110e0c;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}

#top{position:absolute;top:12px;left:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(27,22,19,.85);border:1px solid var(--line);padding:8px 12px;border-radius:4px;max-width:calc(100% - 240px)}
#top b{font-family:var(--font-display);font-size:17px;color:var(--gold)}
#top span{color:var(--mute)}
#top .gold{color:var(--gold);font-variant-numeric:tabular-nums}

#target{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(320px,50vw);background:rgba(27,22,19,.9);border:1px solid var(--line);padding:8px 12px;border-radius:4px;text-align:center;display:flex;align-items:center;justify-content:space-between;gap:8px}
#target .tg-content{flex:1}
#target .nm{font-family:var(--font-display);font-size:14px;margin-bottom:4px}
#infoBtn{background:var(--gold);color:#000;font-weight:700;border-radius:50%;width:26px;height:26px;padding:0;line-height:26px;border:none;flex-shrink:0}

/* RADAR / MINI HARİTA */
#minimapContainer{position:absolute;top:12px;right:16px;width:120px;height:120px;background:rgba(13,11,10,0.85);border:2px solid var(--gold);border-radius:50%;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,0.8);z-index:10}
#minimapCanvas{width:100%;height:100%}

#mobInfoModal, #npcDialogModal{position:absolute;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:35;backdrop-filter:blur(4px)}
.modal-card{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:20px;width:min(420px,90vw);box-shadow:0 10px 30px rgba(0,0,0,0.9)}
.modal-card h3{margin-top:0;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:8px;color:var(--gold);font-family:var(--font-display)}

.bar{height:12px;background:#0a0807;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .12s}
.bar em{position:absolute;inset:0;font-style:normal;font-size:10px;line-height:11px;text-align:center;color:#fff;text-shadow:0 1px 1px #000}
.hp i{background:linear-gradient(#d9473b,#9c241b)}
.mp i{background:linear-gradient(#5a89de,#35599b)}
.xp i{background:linear-gradient(#e0b24a,#a87a1e)}
.tg i{background:linear-gradient(#d9473b,#9c241b)}

#hud{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(880px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;background:rgba(27,22,19,.92);border:1px solid var(--line);padding:10px;border-radius:4px}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#bars .xp{grid-column:1/-1;height:8px}
#skills{display:flex;gap:4px;flex-wrap:wrap}
.sk{position:relative;flex:1 1 0;min-width:46px;padding:6px 2px;text-align:center;font-size:11px;overflow:hidden;line-height:1.2}
.sk kbd{display:block;font-family:var(--font-display);font-weight:700;color:var(--gold);font-size:12px}
.sk small{display:block;color:var(--mute);font-size:9px}

#menuBtns{position:absolute;top:140px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:10}

#panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 2px;font-family:var(--font-display);font-weight:700;font-size:11px;color:var(--mute);border-bottom:2px solid transparent}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#pbody{flex:1;overflow-y:auto;padding:14px;min-height:0}
#pclose{margin:10px 14px 14px;width:calc(100% - 28px)}

.item-card-open{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;position:relative}
.item-card-open .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.item-card-open .title{font-family:var(--font-display);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.item-card-open .st{font-size:13px;color:var(--text);margin-bottom:4px}
.item-card-open .efs{font-size:11px;color:var(--jade);margin-top:2px}
.item-card-open .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}

.item-icon{width:30px;height:30px;background:#110e0c;border:1px solid var(--gold);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;vertical-align:middle}

.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .nm{flex:1 1 120px;min-width:0;font-weight:500;display:flex;align-items:center}

#log{position:absolute;left:16px;bottom:150px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(360px,calc(100% - 32px))}
#log div{background:rgba(13,11,10,.82);padding:4px 8px;border-radius:3px;font-size:12px;animation:fade 7s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

#dead{position:absolute;inset:0;background:rgba(40,6,4,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30;text-align:center}
#dead h2{font-family:var(--font-display);font-size:34px;margin:0;color:var(--blood)}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="fx"></div>
  <div id="playerLabel">Alaz Oflaz <b>(Sv 1)</b></div>
  <div id="mobLabels"></div>

  <!-- RADAR MINI HARİTA -->
  <div id="minimapContainer">
    <canvas id="minimapCanvas" width="120" height="120"></canvas>

  <div id="loginScreen">

      <input type="password" id="passwordInput" maxlength="16" placeholder="Şifre" value="123456">
      
      <div style="margin-top:10px;font-size:12px;color:var(--gold);text-align:left">Karakter Seçimi:</div>
      <div class="char-select-grid" id="charSelectGrid"></div>

  </div>

  <div id="top">
    <b id="tName">Alaz Oflaz</b>
    <span id="tClass" style="color:var(--gold)">Zihinsel Savaşçı</span>
    <b id="tLv">Sv 1</b>
    <span id="tZone">Başlangıç Vadisi</span>
    <span>Yang: <b class="gold" id="tGold" style="font-size:14px">0</b></span>
  </div>

  <div id="target" hidden>
    <div class="tg-content">
      <div class="nm" id="tgName"></div>
      <div class="bar tg"><i id="tgBar"></i><em id="tgTxt"></em></div>
    </div>
    <button id="infoBtn" type="button" title="Bilgi">i</button>
  </div>

  <div id="mobInfoModal" hidden>
    <div class="modal-card">
      <h3 id="modalMobName">Canavar Adı</h3>
      <div style="margin:8px 0;">Türü: <b id="modalMobType" style="color:var(--gold)">-</b></div>
      <div style="margin:8px 0;">Etkili Efsun: <b id="modalMobWeak" style="color:var(--jade)">-</b></div>
      <div style="margin:8px 0;">Düşen Eşyalar: <b id="modalMobDrops" style="color:var(--gold)">-</b></div>
      <button id="closeMobInfoBtn" type="button" style="width:100%;margin-top:14px">Kapat</button>
    </div>
  </div>

  <!-- NPC DİYALOG PENCERESİ -->
  <div id="npcDialogModal" hidden>
    <div class="modal-card">
      <h3 id="npcNameTitle">NPC Adı</h3>
      <div id="npcDialogBody" style="margin:12px 0;line-height:1.5;"></div>
      <div id="npcDialogActions" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;"></div>
      <button id="closeNpcBtn" type="button" style="width:100%;margin-top:10px">Ayrıl</button>
    </div>
  </div>

  <div id="menuBtns">
    <button id="switchCharBtn" type="button">Karakter Değiştir</button>
    <button id="menuBtn" type="button">Çanta / Sistemler (I)</button>
  </div>

  <div id="log"></div>

  <div id="hud">
    <div id="bars">
      <div class="bar hp"><i id="hpBar"></i><em id="hpTxt"></em></div>
      <div class="bar mp"><i id="mpBar"></i><em id="mpTxt"></em></div>
      <div class="bar xp"><i id="xpBar"></i></div>
    </div>
    <div id="skills">
      <button class="sk pot" id="pHp" type="button"><kbd>Z</kbd>Can<small id="nHp">0</small></button>
      <button class="sk pot" id="pMp" type="button"><kbd>X</kbd>Mana<small id="nMp">0</small></button>
      <button class="sk pot" id="mountBtn" type="button"><kbd>B</kbd>Binek<small id="mountTxt">Yaya</small></button>
      <button class="sk pot" id="capeBtn" type="button"><kbd>P</kbd>Pelerin<small id="capeTxt">kapalı</small></button>
      <button class="sk pot" id="auto" type="button"><kbd>F</kbd>Oto Av<small id="autoTxt">kapalı</small></button>
    </div>
  </div>

  <aside id="panel" hidden>
    <div id="tabs">
      <button type="button" data-tab="inv" class="on">Ekipman & Çanta</button>
      <button type="button" data-tab="stats">Statü (C)</button>
      <button type="button" data-tab="skills">Beceriler</button>
      <button type="button" data-tab="shop">Market & Mağaza</button>
    </div>
    <div id="pbody"></div>
    <button id="pclose" type="button">Kapat</button>
  </aside>

  <div id="dead" hidden>
    <h2>Öldün</h2>
    <div>Köy meydanında yeniden doğarsın.</div>
    <button id="revive" type="button">Yeniden Doğ</button>
  </div>
</div>

function mult(p){return 1+0.25*p}
function itemStat(it){
  if(!it)return 0;
  if(it.type==='w') return Math.round(WBASE[it.tier]*mult(it.plus));
  if(it.type==='a') return Math.round(ABASE[it.tier]*mult(it.plus));
  return Math.round(it.tier*4*mult(it.plus));
}

function itemName(it){
  if(!it)return 'Boş';
  var wName = CLASSES[S?S.cls:0].wName;
  var name = '';
  if(it.type==='w') name = WEAPONS[it.tier]+' '+wName;
  else if(it.type==='a') name = ARMORS[it.tier];
  else if(it.type==='helm') name = HELMETS[it.tier]||'Kask';
  else if(it.type==='shield') name = SHIELDS[it.tier]||'Kalkan';
  else name = (JEWELRY[it.tier]||'')+ ' Takı';
  return name + (it.plus?' +'+it.plus:'');
}
function itemValue(it){return (it.tier||1)*(it.tier||1)*30+(it.plus||0)*20}

function totalEfsun(key){
  if(!S)return 0;
  var tot = 0;
  var slots = ['weapon','armor','helm','shield','necklace','earring','bracelet','shoes'];
  for(var i=0;i<slots.length;i++){
    var it = S[slots[i]];
    if(it && Array.isArray(it.efs)){
      for(var j=0;j<it.efs.length;j++){if(it.efs[j].k===key) tot += it.efs[j].v;}
    }
  }
  return tot;
}

function aDef(){

  d += itemStat(S.helm) + itemStat(S.shield) + itemStat(S.necklace) + itemStat(S.earring) + itemStat(S.bracelet) + itemStat(S.shoes);

function GEO(kind,a,b,c){

    if(kind==='box')geoCache[k]=new THREE.BoxGeometry(a,b,c);
    else if(kind==='cyl')geoCache[k]=new THREE.CylinderGeometry(a,b,c,8);
    else if(kind==='sph')geoCache[k]=new THREE.SphereGeometry(a,b||10,c||10);
    else if(kind==='oct')geoCache[k]=new THREE.OctahedronGeometry(a,b||0);
    else if(kind==='ring')geoCache[k]=new THREE.RingGeometry(a,b,c||32);
  }
  return geoCache[k];
}
function MAT(c,kind){
  var k=c+(kind||'l');

    if(kind==='p')matCache[k]=new THREE.MeshPhongMaterial({color:c,shininess:70});
    else matCache[k]=new THREE.MeshLambertMaterial({color:c});

}

function makeBar(parent,y,w){

  fg.center.set(0,0.5);fg.scale.set(w,0.14,1);fg.position.set(-w/2,y,0);fg.renderOrder=21;
  bg.visible=false;fg.visible=false;parent.add(bg);parent.add(fg);

function gainXp(n){
  if(!S)return;
  S.xp+=n;
  while(S.xp>=need(S.lv)){
    S.xp-=need(S.lv);S.lv++;S.sp++;S.statPts+=3;
    S.hp=maxHp();S.mp=maxMp();
    addLog('SEVİYE ATLADIN! Sv '+S.lv+' (+1 Beceri, +3 Statü Puanı)');
  }
}

function killMonster(m){
  m.dead=true;m.st='dead';
  if(m.label && m.label.parentNode) m.label.parentNode.removeChild(m.label);
  setBar(m.bar,0,false);
  S.kills++;gainXp(m.t.xp);
  var goldAmt = RI(m.t.gold[0],m.t.gold[1]);
  S.gold += goldAmt;
  addLog(m.t.name+' mağlup edildi! (+'+goldAmt+' Yang)');
  if(m.isBoss){
    addLog('BOSS MAGLUP EDİLDI! Büyük ganimet kazandın!');
    S.efsunObj+=3; S.blessPaper+=2;
    if(Math.random()<0.5) S.bioOrcTooth++;
  }
}

function hitMonster(m,dmg){
  m.hp-=dmg;
  if(m.st!=='chase')m.st='chase';
  if(m.hp<=0){m.hp=0;killMonster(m)}
}

function updateRadar(){
  var c = $('minimapCanvas'), ctx = c.getContext('2d');
  ctx.clearRect(0,0,120,120);
  ctx.fillStyle = '#0b0908'; ctx.fillRect(0,0,120,120);
  
  if(!S)return;
  var cx = 60, cy = 60, scale = 0.08;
  
  /* Oyuncu */
  ctx.fillStyle = '#4a78c9'; ctx.beginPath(); ctx.arc(cx,cy,4,0,6.28); ctx.fill();
  
  /* NPC'ler (Yeşil) */
  ctx.fillStyle = '#3f9a82';
  for(var i=0;i<NPCS.length;i++){
    var nx = cx + (NPCS[i].x - S.x)*scale, ny = cy + (NPCS[i].y - S.y)*scale;
    if(nx>0&&nx<120&&ny>0&&ny<120){ctx.beginPath();ctx.arc(nx,ny,3,0,6.28);ctx.fill();}
  }

  /* Canavarlar & Bosslar (Kırmızı / Parlak Kırmızı) */
  for(var j=0;j<monsters.length;j++){
    var m = monsters[j]; if(m.dead)continue;
    var mx = cx + (m.x - S.x)*scale, my = cy + (m.y - S.y)*scale;
    if(mx>0&&mx<120&&my>0&&my<120){
      ctx.fillStyle = m.isBoss ? '#ff3300' : '#c0392f';
      ctx.beginPath();ctx.arc(mx,my,m.isBoss?4:2,0,6.28);ctx.fill();
    }
  }

  /* Metinler (Mor) */
  ctx.fillStyle = '#b88cf5';
  for(var k=0;k<metins.length;k++){
    var mt = metins[k]; if(!mt.alive)continue;
    var tx = cx + (mt.x - S.x)*scale, ty = cy + (mt.y - S.y)*scale;
    if(tx>0&&tx<120&&ty>0&&ty<120){ctx.beginPath();ctx.arc(tx,ty,3,0,6.28);ctx.fill();}
  }
}

  /* Hareket ve Hedef */
  if(moveTo){
    var dx=moveTo.x-S.x, dy=moveTo.y-S.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d>4){
      S.x += (dx/d)*currentSpeed*dt;
      S.y += (dy/d)*currentSpeed*dt;
      face = Math.atan2(dx,dy);
    }else moveTo=null;
  }

  /* NPC Etkileşim Kontrolü */
  for(var i=0;i<NPCS.length;i++){
    if(dist(S.x,S.y,NPCS[i].x,NPCS[i].y)<40 && !moveTo){
      openNpcDialog(NPCS[i]);
      moveTo=null;
      break;
    }
  }

  /* Canavar Yapay Zekası */
  for(var j=0;j<monsters.length;j++){
    var m=monsters[j]; if(m.dead)continue;
    var dp=dist(m.x,m.y,S.x,S.y);
    if(m.st==='chase'){
      if(dp>m.t.r+10){
        m.x += ((S.x-m.x)/dp)*m.t.spd*dt;
        m.y += ((S.y-m.y)/dp)*m.t.spd*dt;
      }else if(T-lastHit>1.2){
        lastHit=T;
        var dmg=Math.max(1,Math.round(m.t.atk - aDef()*0.4));
        S.hp-=dmg;
        addLog(m.t.name+' sana '+dmg+' hasar vurdu!');
      }
    }
  }

  updateRadar();
}

function render(){
  if(!S)return;
  playerModel.g.position.set(S.x*SC, hAt(S.x,S.y), S.y*SC);
  playerModel.g.rotation.y = face;

  camera.position.set(S.x*SC + Math.sin(camYaw)*camDist, hAt(S.x,S.y)+10, S.y*SC + Math.cos(camYaw)*camDist);
  camera.lookAt(S.x*SC, hAt(S.x,S.y)+1.5, S.y*SC);

  /* Canavar Modelleri */
  for(var i=0;i<monsters.length;i++){
    var m=monsters[i];
    m.mo.g.position.set(m.x*SC, hAt(m.x,m.y), m.y*SC);
  }

  renderer.render(scene,camera);
}

function frame(ts){
  update(0.016);
  render();
  requestAnimationFrame(frame);
}

$('startGameBtn').addEventListener('click',function(){
  S = loadSlotData(selectedSlotIdx);
  $('loginScreen').hidden = true;
  initWorld();
  requestAnimationFrame(frame);
});

})();
</script>
</body></html>
